name = "ark-control-api"
main = "src/index.ts"
compatibility_date = "2026-07-14"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "ark_control"
database_id = "d082d24c-4677-415f-bb1c-bda9d1e62937"

[[services]]
binding = "ARK_SSH"
service = "ark-ssh"
entrypoint = "ArkSshRpc"

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
QQBOT_UID = "913468406"
OIDC_ISSUER = "https://ark-control-api.dltest.workers.dev"
OIDC_SUBJECT = "ark-gcp-vps-manager"
OIDC_KEY_ID = "ark-oidc-key-1"
OIDC_TOKEN_TTL_SECONDS = "300"

[triggers]
crons = ["*/10 * * * *", "15 3 * * *"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
